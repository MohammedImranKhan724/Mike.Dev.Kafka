services:
  postgres:
    image: postgres:16
    container_name: kafka-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mike_dev_kafka_producer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MikeDevKafkaCluster01'
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: 'BACKWARD'
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: Mike.Dev.Kafka.Producer/Dockerfile
    container_name: kafka-producer-app
    depends_on:
      - postgres
      - kafka
    environment:
      ConnectionStrings__OutboxDb: "Host=postgres;Port=5432;Database=mike_dev_kafka_producer;Username=postgres;Password=postgres"
      Kafka__Producer__BootstrapServers: "kafka:29092"
      Kafka__Transaction__BootstrapServers: "kafka:29092"
      Kafka__SchemaRegistry__Url: "http://schema-registry:8081"
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Mike.Dev.Kafka.Consumer/Dockerfile
    container_name: kafka-consumer-app
    depends_on:
      - kafka
    environment:
      Kafka__Producer__BootstrapServers: "kafka:29092"
      Kafka__Consumer__BootstrapServers: "kafka:29092"
      Kafka__Transaction__BootstrapServers: "kafka:29092"
      Kafka__SchemaRegistry__Url: "http://schema-registry:8081"
    restart: unless-stopped

volumes:
  pgdata: